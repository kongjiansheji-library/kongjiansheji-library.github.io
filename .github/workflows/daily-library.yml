name: Daily material collection and publish
on:
  schedule:
    - cron: '23 19 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'automation/README.md']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: material-library-publish
  cancel-in-progress: false
jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependency
        run: python -m pip install 'Pillow>=11.3,<13'
      - name: Verify collector
        run: python -m unittest discover -s automation -p 'test_*.py'
      - name: Collect and classify
        id: collect
        if: github.event_name != 'push'
        continue-on-error: true
        run: python automation/collect.py --max-new 500
      - name: Preserve results
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auto-data.json auto-data.js discovery-data.json discovery-data.js sync-status.json sync-status.js images/auto thumbs/auto
          if ! git diff --cached --quiet; then
            git commit -m 'Daily material sync and source report'
            git push origin HEAD:main
          fi
      - name: Prepare website only
        run: python automation/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report unavailable image providers
        if: steps.collect.outcome == 'failure'
        run: |
          echo 'The site was published with the latest source report, but image providers failed. Inspect sync-status.json.'
          exit 1
